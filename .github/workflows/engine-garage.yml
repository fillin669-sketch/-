name: Сборка APK «Мотор-Гараж»

on:
  push:
    paths:
      - 'engine-garage/**'
      - '.github/workflows/engine-garage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-garage
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Кеш ключа подписи
        uses: actions/cache@v4
        with:
          path: ~/.motorgarage-signing
          key: motorgarage-signing-v1

      - name: Подготовить ключ подписи
        run: |
          DIR="$HOME/.motorgarage-signing"
          mkdir -p "$DIR"
          # постоянный ключ, созданный один раз и сохранённый в кеше Actions:
          # обновления ставятся поверх старой версии без удаления
          if [ ! -f "$DIR/release.jks" ]; then
            openssl rand -hex 16 > "$DIR/pass"
            keytool -genkeypair -keystore "$DIR/release.jks" -alias enginegarage -keyalg RSA -keysize 2048 \
              -validity 20000 -storepass "$(cat "$DIR/pass")" -keypass "$(cat "$DIR/pass")" -dname "CN=Motor Garage"
          fi
          PASS="$(cat "$DIR/pass")"
          echo "::add-mask::$PASS"
          echo "SIGNING_KEYSTORE=$DIR/release.jks" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=enginegarage" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Собрать APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../MotorGarage.apk

      - name: Сохранить APK как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: MotorGarage-apk
          path: MotorGarage.apk

      - name: Опубликовать APK в релизе «motor-garage-latest»
        uses: softprops/action-gh-release@v2
        with:
          tag_name: motor-garage-latest
          name: Мотор-Гараж (последняя сборка)
          body: |
            Свежая сборка игры «Мотор-Гараж» из ветки ${{ github.ref_name }} (коммит ${{ github.sha }}).
            Скачайте MotorGarage.apk на телефон и установите.
          prerelease: true
          make_latest: false
          files: MotorGarage.apk
