name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Собрать APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk SeaTrader.apk

      - name: Сохранить APK как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: SeaTrader-apk
          path: SeaTrader.apk

      - name: Опубликовать APK в релизе «latest»
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Морские волки (последняя сборка)
          body: |
            Свежая сборка из ветки ${{ github.ref_name }} (коммит ${{ github.sha }}).
            Скачайте SeaTrader.apk на телефон и установите.
          prerelease: true
          make_latest: true
          files: SeaTrader.apk
