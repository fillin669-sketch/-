name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Кеш ключа подписи
        uses: actions/cache@v4
        with:
          path: ~/.seawolves-signing
          key: seawolves-signing-v1

      - name: Подготовить ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          DIR="$HOME/.seawolves-signing"
          mkdir -p "$DIR"
          if [ -n "$KEYSTORE_BASE64" ]; then
            # собственный ключ из секретов репозитория
            echo "Подпись: постоянный ключ из секретов репозитория"
            # с телефона в строку легко попадают пробелы, переносы, кавычки — оставляем только символы base64
            # вместе со значением могли скопироваться и подписи из инструкции (KEYSTORE_BASE64 и т. п.) — убираем их
            CLEAN="$(printf '%s' "$KEYSTORE_BASE64" | sed 's/KEYSTORE_BASE64//g' | tr -cd 'A-Za-z0-9+/=')"
            lastline() { printf '%s\n' "$1" | tr -d '\r' | sed "s/$2//g" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | tail -1; }
            KEYSTORE_PASSWORD="$(lastline "$KEYSTORE_PASSWORD" KEYSTORE_PASSWORD)"
            KEYSTORE_ALIAS="$(lastline "$KEYSTORE_ALIAS" KEYSTORE_ALIAS)"
            echo "::add-mask::$KEYSTORE_PASSWORD"
            echo "Длина ключа в секрете: ${#CLEAN} символов"
            printf '%s' "$CLEAN" | base64 -d > "$DIR/own.jks" 2>/dev/null || true
            echo "Отпечаток файла ключа: $(sha256sum "$DIR/own.jks" | cut -c1-12)"
            KS="$DIR/own.jks"; PASS="$KEYSTORE_PASSWORD"; ALIAS="${KEYSTORE_ALIAS:-seawolves}"
            # ключ должен открываться паролем — иначе останавливаемся с понятной ошибкой
            if ! keytool -list -keystore "$KS" -storepass "$PASS" -alias "$ALIAS" > /dev/null 2>&1; then
              echo "::error::Секрет KEYSTORE_BASE64 повреждён или не подходит пароль/имя ключа"; exit 1
            fi
          else
            echo "::warning::Секреты KEYSTORE_* не найдены — подпись временным ключом из кеша"
            # постоянный ключ, созданный один раз и сохранённый в кеше Actions
            if [ ! -f "$DIR/release.jks" ]; then
              openssl rand -hex 16 > "$DIR/pass"
              keytool -genkeypair -keystore "$DIR/release.jks" -alias seawolves -keyalg RSA -keysize 2048 \
                -validity 20000 -storepass "$(cat "$DIR/pass")" -keypass "$(cat "$DIR/pass")" -dname "CN=Sea Wolves"
            fi
            KS="$DIR/release.jks"; PASS="$(cat "$DIR/pass")"; ALIAS=seawolves
          fi
          echo "::add-mask::$PASS"
          echo "SIGNING_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Собрать APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk SeaTrader.apk
          # номер версии — в описание релиза: по нему игра узнаёт об обновлении
          echo "APP_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_ENV"

      - name: Сохранить APK как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: SeaTrader-apk
          path: SeaTrader.apk

      - name: Опубликовать APK в релизе «latest»
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Пираты Семи Ветров (последняя сборка)
          body: |
            Версия: ${{ env.APP_VERSION }}
            Свежая сборка из ветки ${{ github.ref_name }} (коммит ${{ github.sha }}).
            Скачайте SeaTrader.apk на телефон и установите.
          prerelease: true
          make_latest: true
          files: SeaTrader.apk
