<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Морские волки</title>
<style>
  :root {
    --stroke: 0 2px 0 #1b2a3a, 0 -1px 0 #1b2a3a, 1px 0 0 #1b2a3a, -1px 0 0 #1b2a3a, 0 3px 4px rgba(0,0,0,.4);
    --panel: #10304d;
    --panel2: #164266;
    --gold: #ffc93c;
    --green: #3ddc84;
    --red: #ff5a5f;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fc5e8; touch-action: none;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; color: #fff; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .btn-round { pointer-events: auto; position: absolute; border: none; background: none; padding: 0; cursor: pointer; }
  #pauseBtn { left: 18px; top: calc(16px + var(--safe-top)); width: 56px; height: 64px; display: flex; gap: 10px; justify-content: center; }
  #pauseBtn i { width: 18px; height: 60px; background: #fff; border-radius: 6px; box-shadow: 0 4px 0 #1b2a3a, 0 0 0 3px #1b2a3a; }
  #boostBtn { left: 14px; top: calc(96px + var(--safe-top)); width: 88px; height: 88px; border-radius: 50%;
    background: rgba(255,255,255,.12); border: 3px solid rgba(255,255,255,.55); overflow: hidden; }
  #boostBtn svg { width: 70%; height: 70%; margin-top: 4px; }
  #boostCd { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(rgba(10,30,50,.65) var(--p, 0%), transparent 0); }
  #boostBtn.active { border-color: var(--green); box-shadow: 0 0 18px var(--green); }
  #currency { position: absolute; right: 12px; top: calc(14px + var(--safe-top)); display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .cur { display: flex; align-items: center; gap: 6px; background: rgba(10,20,30,.55); border-radius: 22px; padding: 4px 6px 4px 22px;
    font-weight: 900; font-size: 26px; text-shadow: var(--stroke); min-width: 120px; justify-content: flex-end; }
  .coin { width: 34px; height: 34px; border-radius: 50%; display: inline-block; flex: none;
    background: radial-gradient(circle at 35% 30%, #fff3b0 0 18%, #ffd23f 30%, #f5a400 70%, #c47f00 100%); box-shadow: inset 0 0 0 3px #e09600; }
  .gem { width: 34px; height: 30px; display: inline-block; flex: none;
    background: linear-gradient(160deg, #ffb3ff 0%, #e040fb 45%, #9c27b0 100%);
    clip-path: polygon(20% 0, 80% 0, 100% 35%, 50% 100%, 0 35%); }
  .coin.sm, .gem.sm { width: 22px; height: 20px; vertical-align: middle; }
  .coin.sm { height: 22px; }

  #quest { position: absolute; left: 116px; right: 12px; margin: 0 auto; max-width: 440px; top: calc(112px + var(--safe-top));
    background: linear-gradient(#2f8ff0, #1b6fd1); border-radius: 6px; padding: 6px 10px 8px 48px; box-shadow: 0 3px 0 #0d3f7a, 0 6px 12px rgba(0,0,0,.25); }
  #questIcon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-size: 28px; filter: drop-shadow(0 2px 0 #0d3f7a); }
  #questText { font-weight: 900; font-size: 16px; text-align: center; text-shadow: var(--stroke); line-height: 1.15; }
  .bar { height: 12px; background: #0d2f57; border-radius: 4px; margin-top: 5px; overflow: hidden; }
  #questBar { height: 100%; width: 0; background: linear-gradient(#ffe55c, #f5b700); transition: width .3s; }
  #quest.done { animation: pop .6s; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.1); } 100% { transform: scale(1); } }

  #target { position: absolute; left: 50%; bottom: calc(18px + var(--safe-bottom)); transform: translateX(-50%); text-align: center; font-weight: 900; text-shadow: var(--stroke); }
  #targetIcon { width: 40px; height: 40px; margin: 0 auto 2px; border-radius: 50%; background: rgba(60,70,80,.75); display: flex; align-items: center; justify-content: center; font-size: 22px; }
  #targetDist { font-size: 22px; }
  #arrow { position: absolute; width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent;
    border-bottom: 26px solid var(--gold); filter: drop-shadow(0 2px 0 #7a5200); transform-origin: 50% 60%; display: none; }

  #joy { position: absolute; width: 190px; height: 190px; margin: -95px 0 0 -95px; border-radius: 50%; border: 4px solid var(--green);
    background: rgba(61,220,132,.06); display: none; }
  #joyTri { position: absolute; left: 50%; top: 50%; width: 0; height: 0; border-left: 26px solid transparent; border-right: 26px solid transparent;
    border-bottom: 64px solid var(--green); opacity: .9; transform-origin: 50% 0; }
  #joyKnob { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(255,255,255,.35); border: 3px solid rgba(255,255,255,.7); left: 50%; top: 50%; }

  #labels { position: absolute; inset: 0; overflow: hidden; }
  .hp { position: absolute; width: 64px; height: 9px; margin-left: -32px; background: rgba(0,0,0,.55); border-radius: 4px; border: 1px solid rgba(0,0,0,.6); overflow: hidden; }
  .hp > div { height: 100%; background: var(--red); }
  .hp.me > div { background: var(--green); }
  .hp.boss { width: 110px; margin-left: -55px; height: 12px; }
  .hp.boss > div { background: #b388ff; }
  .float { position: absolute; font-weight: 900; font-size: 22px; text-shadow: var(--stroke); white-space: nowrap; transform: translate(-50%, 0); animation: rise 1s ease-out forwards; }
  .float.dmg { color: #fff; font-size: 18px; }
  .float.bad { color: #ff8a80; }
  .float.gold { color: var(--gold); }
  .float.gemt { color: #ff9cff; }
  @keyframes rise { from { transform: translate(-50%, 0); opacity: 1; } to { transform: translate(-50%, -60px); opacity: 0; } }
  .portLabel { position: absolute; transform: translate(-50%, -100%); font-weight: 900; font-size: 15px; text-shadow: var(--stroke); white-space: nowrap; text-align: center; }

  #toast { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); font-weight: 900; font-size: 30px; text-align: center;
    text-shadow: var(--stroke); opacity: 0; transition: opacity .3s; white-space: pre-line; width: 90vw; }
  #toast.show { opacity: 1; }
  #damageFlash { position: absolute; inset: 0; box-shadow: inset 0 0 120px rgba(255,0,0,.7); opacity: 0; transition: opacity .25s; }

  .overlay { position: fixed; inset: 0; background: rgba(5,20,35,.72); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .overlay.hidden { display: none; }
  .panel { width: min(94vw, 520px); max-height: 92vh; display: flex; flex-direction: column; background: var(--panel); border-radius: 18px;
    border: 3px solid #2b6ca3; box-shadow: 0 8px 0 #071a2b, 0 16px 40px rgba(0,0,0,.5); overflow: hidden; }
  .panel h2 { margin: 0; padding: 14px 16px 8px; font-size: 26px; text-align: center; text-shadow: var(--stroke); }
  .panel .sub { text-align: center; color: #b9d6f2; font-size: 15px; padding: 0 16px 8px; }
  .tabs { display: flex; gap: 8px; padding: 0 12px 10px; }
  .tab { flex: 1; padding: 10px; border-radius: 10px; background: var(--panel2); border: none; color: #fff; font: inherit; font-weight: 900; font-size: 16px; }
  .tab.on { background: #2f8ff0; box-shadow: 0 3px 0 #0d3f7a; }
  .scroll { overflow-y: auto; padding: 0 12px 12px; flex: 1; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  .card { background: var(--panel2); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
  .card.current { outline: 3px solid var(--green); }
  .card h3 { margin: 0 0 2px; font-size: 19px; }
  .card .cls { color: var(--gold); font-weight: 900; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; }
  .card p { margin: 4px 0 8px; color: #b9d6f2; font-size: 14px; }
  .stat { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 3px 0; }
  .stat span { width: 92px; color: #cfe3f7; }
  .stat .sb { flex: 1; height: 8px; background: #0b2238; border-radius: 4px; overflow: hidden; }
  .stat .sb div { height: 100%; background: linear-gradient(90deg, #3ddc84, #8ff0b5); }
  .stat b { width: 44px; text-align: right; }
  .big { width: 100%; margin-top: 8px; padding: 12px; border-radius: 12px; border: none; color: #fff; font: inherit; font-weight: 900; font-size: 18px;
    background: linear-gradient(#45d483, #22a95c); box-shadow: 0 4px 0 #126b39; text-shadow: 0 2px 0 rgba(0,0,0,.3); display: flex; gap: 6px; justify-content: center; align-items: center; }
  .big.blue { background: linear-gradient(#3aa0ff, #1b6fd1); box-shadow: 0 4px 0 #0d3f7a; }
  .big.gray { background: #3b5368; box-shadow: 0 4px 0 #22313f; color: #c9d6e2; }
  .big.red { background: linear-gradient(#ff6b6b, #d63a3a); box-shadow: 0 4px 0 #7f1d1d; }
  .big:active { transform: translateY(2px); box-shadow: 0 2px 0 #126b39; }
  .footer { padding: 10px 12px 14px; background: #0c2740; }
  .uprow { display: flex; align-items: center; gap: 10px; }
  .uprow .ic { font-size: 30px; }
  .uprow .info { flex: 1; }
  .pips { display: flex; gap: 4px; margin: 4px 0; }
  .pips i { width: 22px; height: 8px; border-radius: 3px; background: #0b2238; }
  .pips i.on { background: var(--gold); }
  .uprow .big { width: auto; min-width: 110px; margin: 0; font-size: 16px; padding: 10px; }
  .menuBtns { padding: 6px 16px 18px; display: flex; flex-direction: column; gap: 6px; }
  #loading { position: fixed; inset: 0; background: #0c2740; display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 20;
    font-weight: 900; font-size: 34px; text-shadow: var(--stroke); }
  #loading small { font-size: 16px; color: #9cc3e6; margin-top: 10px; text-shadow: none; font-weight: 600; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="labels"></div>
  <div id="damageFlash"></div>
  <div id="arrow"></div>
  <div id="joy"><div id="joyTri"></div><div id="joyKnob"></div></div>
  <button id="pauseBtn" class="btn-round" aria-label="Пауза"><i></i><i></i></button>
  <button id="boostBtn" class="btn-round" aria-label="Рывок">
    <svg viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round">
      <path d="M18 78 L40 28 L46 70 Z" fill="rgba(255,255,255,.85)"/>
      <path d="M40 72 L60 24 L66 66 Z" fill="rgba(255,255,255,.85)"/>
      <path d="M62 64 L80 22 L86 60 Z" fill="rgba(255,255,255,.85)"/>
    </svg>
    <div id="boostCd"></div>
  </button>
  <div id="currency">
    <div class="cur"><span id="coins">0</span><i class="coin"></i></div>
    <div class="cur"><span id="gems">0</span><i class="gem"></i></div>
  </div>
  <div id="quest"><div id="questIcon">☠️</div><div id="questText"></div><div class="bar"><div id="questBar"></div></div></div>
  <div id="target"><div id="targetIcon">?</div><div id="targetDist"></div></div>
  <div id="toast"></div>
</div>

<div id="portMenu" class="overlay hidden"><div class="panel">
  <h2 id="portName">Порт</h2>
  <div class="sub" id="portSub"></div>
  <div class="tabs"><button class="tab on" data-tab="ships">⛵ Верфь</button><button class="tab" data-tab="upgrades">🔧 Улучшения</button></div>
  <div class="scroll" id="portContent"></div>
  <div class="footer"><button class="big blue" id="sailBtn">⚓ Выйти в море</button></div>
</div></div>

<div id="pauseMenu" class="overlay hidden"><div class="panel">
  <h2>Пауза</h2>
  <div class="sub" id="pauseStats"></div>
  <div class="menuBtns">
    <button class="big" id="resumeBtn">▶ Продолжить</button>
    <button class="big blue" id="soundBtn">🔊 Звук: вкл</button>
    <button class="big gray" id="resetBtn">↺ Начать заново</button>
  </div>
</div></div>

<div id="deathMenu" class="overlay hidden"><div class="panel">
  <h2>☠️ Корабль потоплен!</h2>
  <div class="sub" id="deathText"></div>
  <div class="menuBtns"><button class="big" id="respawnBtn">⚓ Вернуться в порт</button></div>
</div></div>

<div id="loading">⛵ Морские волки<small>Поднимаем паруса…</small></div>
<script src="bundle.js"></script>
</body>
</html>
